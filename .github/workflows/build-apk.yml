name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk ShakeAndChat.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ShakeAndChat-APK
          path: ShakeAndChat.apk

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.${{ github.run_number }}
          name: Shake and Chat v0.${{ github.run_number }}
          body: "🫨 Shake and Chat — Made in India 🇮🇳. Kinda unna ShakeAndChat.apk download chesi install cheyyandi."
          files: ShakeAndChat.apk
          make_latest: "true"
